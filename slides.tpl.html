<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG 是什麼？｜HTML 教學簡報</title><link rel="stylesheet" href="assets/site.css"><meta name="description" content="15 頁互動式 RAG 入門教學簡報，每頁可追溯來源與 LLM Wiki。"></head><body class="deck-body"><header class="deck-top"><a class="brand" href="index.html">RAG<span>.wiki</span> / SLIDES</a><div class="meta">初學者教學 · 6 份來源</div><nav><a href="wiki.html">查看 Wiki</a><a href="workflow.html">Graph</a></nav></header><main class="deck-main"><article class="slide" id="slide" tabindex="0" aria-live="polite"></article></main><div class="progress-track"><div class="progress" id="progress"></div></div><footer class="deck-bottom"><div class="small-links" id="footer-sources"></div><div class="deck-buttons"><span class="kbd">← / → 切換</span><button class="round" id="prev" aria-label="上一頁">←</button><span class="deck-index" id="index"></span><button class="round" id="next" aria-label="下一頁">→</button></div></footer><script>const DATA=__DATA__;const slides=DATA.slides;let i=Math.min(slides.length-1,Math.max(0,Number(new URLSearchParams(location.search).get('s'))||0));const $=x=>document.querySelector(x),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const s=slides[i];const specials=s.type==='process'?'<div class="trail"><span class="step">RETRIEVE</span><span class="arr">→</span><span class="step">AUGMENT</span><span class="arr">→</span><span class="step">GENERATE</span></div>':s.type==='workflow'?'<div class="trail"><span class="step">SOURCE</span><span class="arr">→</span><span class="step">WIKI</span><span class="arr">→</span><span class="step">LINT</span><span class="arr">→</span><span class="step">HTML</span></div>':'';$('#slide').className='slide '+(s.type==='cover'?'cover':'');$('#slide').innerHTML=`<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p>${specials}<div class="content-grid">${s.points.map((p,j)=>`<div class="point"><span class="marker">${String(j+1).padStart(2,'0')}</span><span>${esc(p)}</span></div>`).join('')}</div><div class="source-foot"><span class="mini-tag">WIKI →</span>${s.wiki.map(id=>{const p=DATA.pages.find(p=>p.id===id);return `<a href="wiki.html#${id}" title="查看 Wiki 條目">${esc(p.title)}</a>`}).join('')}<span class="mini-tag">SOURCES →</span>${s.sources.map(id=>{const z=DATA.sources.find(z=>z.id===id);return `<a title="${esc(z.title)}" target="_blank" rel="noopener noreferrer" href="${z.url}">${id}</a>`}).join('')}</div>`;$('#slide').scrollTop=0;$('#index').textContent=`${i+1} / ${slides.length}`;$('#progress').style.width=((i+1)/slides.length*100)+'%';$('#prev').disabled=i===0;$('#next').disabled=i===slides.length-1;$('#footer-sources').textContent=`第 ${i+1} 頁 · ${s.id} · ${s.wiki.length} 個 Wiki 對應`;history.replaceState(null,'',location.pathname+'?s='+i)}function go(n){i=Math.max(0,Math.min(slides.length-1,i+n));draw()}$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){if(e.target.matches('button,a,input'))return;e.preventDefault();go(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==='Home'){i=0;draw()}else if(e.key==='End'){i=slides.length-1;draw()}});let x0=null;$('#slide').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});$('#slide').addEventListener('touchend',e=>{if(x0!==null){let diff=e.changedTouches[0].clientX-x0;if(Math.abs(diff)>90)go(diff<0?1:-1);x0=null}},{passive:true});draw();</script></body></html>
