<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Wiki · RAG 入門</title><link rel="stylesheet" href="assets/site.css"></head><body><div class="bg-orb"></div><header class="global"><a class="brand" href="index.html">RAG<span>.wiki</span></a><nav><a href="index.html">首頁</a><a class="active" href="wiki.html">知識 Wiki</a><a href="slides.html">教學簡報</a><a href="workflow.html">流程與紀錄</a></nav></header><div class="wiki-shell"><aside class="wiki-sidebar"><h2>LLM Wiki <span style="color:var(--cyan)">/ 10 pages</span></h2><input id="search" class="search" aria-label="搜尋 Wiki 條目" placeholder="搜尋觀念，例如 embedding…"><p class="mini-help">選擇條目，查看交叉連結與來源</p><div id="navpages"></div><div style="border-top:1px solid var(--line);margin-top:23px;padding-top:14px"><button class="round" id="show-sources">查看六份來源</button></div></aside><main class="wiki-main" id="view" aria-live="polite"></main></div><script>const DATA={"title":"RAG 是什麼？讓 AI 查資料再回答","date":"2026-11-23","sources":[{"id":"S01","title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","author":"Lewis et al.","publisher":"NeurIPS / arXiv","year":2020,"url":"https://arxiv.org/abs/2005.11401","topic":"RAG 起源與基本架構","claims":["RAG 將預先訓練的生成模型與外部可檢索的知識結合。","外部知識可作為生成內容的依據，不必只依賴模型參數。","原論文探討檢索器與生成器的結合及知識密集型任務。"]},{"id":"S02","title":"Retrieval augmented generation (RAG) and indexes in Microsoft Foundry","author":"Microsoft","publisher":"Microsoft Learn","year":2026,"url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation","topic":"Retrieve–Augment–Generate、索引與搜尋方式","claims":["RAG 常可拆解為 retrieve、augment、generate 三階段。","索引可支援關鍵字、語意、向量或混合搜尋。","來源資料需要具有可追溯性與權限管控。"]},{"id":"S03","title":"Introducing Contextual Retrieval","author":"Anthropic","publisher":"Anthropic Research","year":2024,"url":"https://www.anthropic.com/research/contextual-retrieval","topic":"分塊語境、BM25、Embedding、重排序","claims":["被切成小段的文字可能失去原本的文件脈絡。","BM25 偏向字詞配對，語意向量搜尋可捕捉語意相近內容。","混合檢索與重排序是可評估的改進方向，並非每個資料集都必然有效。"]},{"id":"S04","title":"What is retrieval augmented generation (RAG)?","author":"IBM","publisher":"IBM Think","year":2026,"url":"https://www.ibm.com/think/topics/retrieval-augmented-generation","topic":"初學者概念、資料準備、限制與微調差異","claims":["RAG 可連接外部知識庫，提高特定領域回覆的相關性。","資料分塊太大或太小都可能降低檢索效果。","RAG 可降低幻覺風險，但無法保證生成完全正確。","RAG 的查資料與 Fine-tuning 的參數更新是不同方法。"]},{"id":"S05","title":"RAGAS: Automated Evaluation of Retrieval Augmented Generation","author":"Es et al.","publisher":"arXiv","year":2023,"url":"https://arxiv.org/abs/2309.15217","topic":"檢索與生成分開評估","claims":["RAG 品質至少要同時考慮檢索內容的相關性與回答是否忠於證據。","RAGAS 提供無需逐題人工標準答案的自動評估方向。","評估分數與具體定義需按實作與資料集解讀。"]},{"id":"S06","title":"Retrieval Augmented Generation options and architectures on AWS","author":"Amazon Web Services","publisher":"AWS Prescriptive Guidance","year":2026,"url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/introduction.html","topic":"RAG 工程選擇與使用情境","claims":["RAG 可讓模型在回答前參考模型訓練來源以外的權威文件。","企業可選擇託管型或自行建置的 RAG 架構。","RAG 的設計需考量資料來源、更新與維運成本。"]}],"pages":[{"id":"overview","title":"RAG 是什麼？","subtitle":"把查到的證據交給 LLM，再讓它回答。","sections":[["一句話定義","Retrieval-Augmented Generation（檢索增強生成）是一種組合「外部資訊檢索」與「語言模型生成」的架構。回答時先找到相關資料，再把資料提供給模型作為上下文。"],["三步驟","Retrieve：搜尋證據。Augment：把問題和證據放在同一個提示中。Generate：依據證據生成回答，並在可能的情況下列出來源。"],["不等於什麼","RAG 不代表模型重新訓練，也不表示有來源就一定正確。LLM Wiki 則是這次專題用來管理知識條目的工具與工作方式，不是 RAG 的同義詞。"]],"sources":["S01","S02","S04"],"related":["motivation","pipeline","limitations"],"example":"一位新進員工問：「公司的退貨期限是幾天？」系統先找到正式退貨政策，再整理回答。","note":""},{"id":"motivation","title":"為什麼需要 RAG？","subtitle":"流暢的回答，不等於有根據的答案。","sections":[["LLM 常見限制","模型訓練時未必讀過私人文件、最近更新的規範或企業內部資料；即使未掌握來源，也可能生成看似合理的內容。"],["RAG 能改善的部分","讓回答以受控的外部文件為基礎，方便更新知識，也能提供可查證的出處。"],["仍需注意","若檢索找到錯誤或過期文件，或模型忽略證據，RAG 仍可能回答錯誤。"]],"sources":["S01","S04","S06"],"related":["overview","limitations"],"example":"假設退貨政策昨天從 14 天改成 7 天，模型即使會回答，也不應只靠舊記憶。","note":""},{"id":"preparation","title":"事前準備：資料變得可檢索","subtitle":"文件 → 清理 → 切段 → 索引。","sections":[["來源整理","確認文件可信、權限合法、版本清楚；原始資料需要保留可回查的連結或檔案名稱。"],["Chunking 分塊","把長文件切成可用的小段；太大會涵蓋不必要內容，太小可能失去主詞、時間或條件。"],["Embedding 與索引","可以把文字轉為向量並存入向量索引，也可以建立 BM25 類型的關鍵字索引；並非所有系統都必須兩者皆用。"]],"sources":["S02","S03","S04"],"related":["pipeline","retrieval"],"example":"「交貨延誤 5 天」若只留下「補償 3%」，就可能失去適用的合約條件。","note":""},{"id":"pipeline","title":"使用者提問時的流程","subtitle":"從問題到有出處的回答。","sections":[["Retrieve","把使用者問題用於查詢文件索引，找回最相關的多個段落。"],["Augment","組合使用者問題、取回的段落、來源識別碼，以及要求「找不到就說不知道」的提示規則。"],["Generate","由 LLM 產生精簡回答；回答後還需檢查是否有超出證據的主張。"]],"sources":["S01","S02","S06"],"related":["overview","preparation","generation"],"example":"Q：延誤 5 天如何處理？→ 找到對應訂單＋延誤政策 → 形成有來源的回覆。","note":""},{"id":"retrieval","title":"檢索方式怎麼選？","subtitle":"關鍵字、語意與混合搜尋。","sections":[["Keyword / BM25","優先搜尋字詞重合，尤其適合料號、代碼、法規條次等精確字串。"],["Embedding","利用向量距離／相似度找出語意相關的段落，即便使用者與文件的用字不同。"],["Hybrid 與 Rerank","可結合兩種結果，再以重排序挑選更相關內容；需要實測驗證效果，不能直接宣稱混合一定最好。"]],"sources":["S02","S03"],"related":["preparation","pipeline","evaluation"],"example":"搜尋「訂單 PO-784」時，字詞檢索有優勢；搜尋「晚到貨要怎麼辦」時，語意檢索可能更有幫助。","note":""},{"id":"generation","title":"回答必須忠於證據","subtitle":"生成不是把檢索段落隨意改寫。","sections":[["Grounding","每一個重要結論都應能指向文件中的支持段落，而不是把模型補充的猜測寫成政策。"],["Citation","保存來源 ID／URL 與頁面位置，讓讀者有能力核查；標上來源不代表已經驗證內容。"],["Abstention","若資料不足、資料互相衝突或缺少關鍵條件，應回答尚無足夠證據，並指出缺什麼。"]],"sources":["S01","S02","S04"],"related":["pipeline","limitations","evaluation"],"example":"政策只寫「可能評估補償」時，不可回答「公司一定賠償 3%」。","note":""},{"id":"example","title":"範例：供應商延誤通知","subtitle":"情境為教學虛構，非真實公司規定。","sections":[["使用者問題","「供應商通知這批零件要晚 5 天到，接下來應該怎麼做？」"],["虛構文件 A","訂單 PO-784：原訂交期 12/10；供應商通知改為 12/15。"],["虛構文件 B","物流政策 P-04：延誤超過 3 天應通知採購主管，並向供應商確認更新交期。"],["示範回答","「PO-784 預計晚 5 天，依 P-04 應通知採購主管，並確認新交期 12/15。」需附上 A、B 來源。"]],"sources":["S02","S04","S06"],"related":["pipeline","generation","limitations"],"example":"這裡用假設文件示範流程，不是說明所有企業必須如此處理。","note":""},{"id":"limitations","title":"RAG 仍可能出錯","subtitle":"錯誤往往不是只有 LLM 的問題。","sections":[["資料層","原始文件過期、權限錯誤、段落切分破壞前後文。"],["檢索層","正確段落未出現在 Top-K，或相似度高但不符合問題限制條件。"],["生成層","模型忽略來源、自行推斷數字，或附上與敘述無關的引文。"],["修正策略","優先修正來源與檢索品質，再改善提示語；把缺少證據的題目交由人工確認。"]],"sources":["S03","S04","S05"],"related":["motivation","retrieval","evaluation"],"example":"把「延誤超過 3 天」錯切為「延誤」與「超過 3 天」兩段，可能導致檢索失真。","note":""},{"id":"evaluation","title":"如何知道 RAG 有沒有用？","subtitle":"分開評估檢索與回答。","sections":[["Retrieval check","測試問題的正確證據是否進入 Top-K（例如 Hit@3、Recall@K）。"],["Groundedness check","逐項檢查回答是否有足夠引用支持，不能只看句子是否通順。"],["教學專案檢查","本作品另檢查 6 筆來源、Wiki 頁面引用、投影片對應、連結完整性；這是結構檢查，不代表模型回答的實證準確率。"]],"sources":["S05","S02","S03"],"related":["retrieval","generation","limitations"],"example":"假設 10 題有 8 題在前三筆找到正確段落，Hit@3 = 80%；仍須檢查回答有沒有正確使用它。","note":""},{"id":"workflow","title":"本專案的 LLM Wiki Graph","subtitle":"這是製作流程的知識管理循環，並非 RAG 推論圖。","sections":[["Source layer","整理 6 篇可靠資料的來源 URL、重點摘要與時間資訊；保存原始來源識別碼。"],["Wiki layer","先討論教學對象與大綱，再由 LLM 將來源重點整理成互相連結的 Markdown 知識頁。"],["Schema + Lint layer","定義來源欄位與引用規則，檢查漏引、壞連結與簡報對應；有問題回到資料與 Wiki 修正。"],["Presentation layer","從相同的 Wiki 知識資料產生教學 HTML 簡報，附各頁 Wiki 與來源回鏈。"]],"sources":["S02","S05","S06"],"related":["overview","evaluation"],"example":"設計原則：先確保來源可追溯，再把知識轉成適合初學者理解的投影片。","note":""}],"slides":[{"id":"intro","kicker":"RAG / INTRO","title":"別讓 AI 靠猜的回答","lead":"RAG 是什麼？讓語言模型先查資料、再回答。","type":"cover","points":["零基礎也能理解","由 6 篇來源整理的 LLM Wiki","從概念、流程到風險與評估"],"wiki":["overview"],"sources":["S01","S02"]},{"id":"goals","kicker":"01 · 學習目標","title":"今天學會 3 件事","lead":"不用寫程式，也能讀懂 RAG 的邏輯。","type":"three","points":["為什麼 LLM 需要外部知識","RAG 的 Retrieve → Augment → Generate","怎麼確認回答有來源、值得相信"],"wiki":["overview","motivation","evaluation"],"sources":["S02","S04","S05"]},{"id":"problem","kicker":"02 · 遇到的問題","title":"AI 說得順，不一定說得對","lead":"不知道最新資訊或內部政策時，LLM 仍可能生成看似合理的回答。","type":"contrast","points":["問題：「我們公司最新退貨期限是幾天？」","沒有資料：模型可能依照一般印象作答","有 RAG：先找到當前正式政策，再回答"],"wiki":["motivation"],"sources":["S01","S04","S06"]},{"id":"analogy","kicker":"03 · 一句話理解","title":"RAG = 開卷考試","lead":"模型不是把書全部重新背下來，而是先翻到相關頁面。","type":"analogy","points":["LLM：擅長解釋與整理","Retriever：負責找出可能相關的證據","Source：需要能被核對的原始資料"],"wiki":["overview"],"sources":["S01","S04"]},{"id":"offline","kicker":"04 · 準備階段","title":"先把資料整理成可搜尋的知識","lead":"建 RAG 不是直接把一整本 PDF 塞進模型。","type":"pipeline","points":["收集文件與版本","將長文分成 Chunks","建立關鍵字或向量索引","保留來源 ID、URL 與適用條件"],"wiki":["preparation"],"sources":["S02","S03","S04"]},{"id":"online","kicker":"05 · 回答階段","title":"Retrieve → Augment → Generate","lead":"每一次提問，都先搜尋資料，再讓模型生成回覆。","type":"process","points":["Retrieve：找相關段落","Augment：組成「問題＋證據」的提示","Generate：依據證據回答並附來源"],"wiki":["pipeline","generation"],"sources":["S01","S02"]},{"id":"search","kicker":"06 · 找資料的方式","title":"精確字詞 vs. 相近意思","lead":"兩種檢索各擅勝場；混合搜尋是否更好需要驗證。","type":"search","points":["BM25：找「PO-784」這種精確代碼","Embedding：理解「晚到貨」與「交期延誤」相關","Hybrid + Rerank：合併結果並重新排序"],"wiki":["retrieval"],"sources":["S02","S03"]},{"id":"case","kicker":"07 · 虛構教學案例","title":"供應商延誤 5 天，怎麼辦？","lead":"以下 A、B 文件為教學虛構，不是任何真實公司的政策。","type":"case","points":["文件 A：PO-784 交期由 12/10 改為 12/15","文件 B：P-04 規定延誤超過 3 天須通知採購主管","生成：通知主管、確認新交期，並引用 A、B"],"wiki":["example","generation"],"sources":["S02","S04"]},{"id":"citations","kicker":"08 · 何謂有依據","title":"好的回答會說「根據哪份文件」","lead":"不只給一個答案，也要讓人找得到依據。","type":"citation","points":["結論：PO-784 預計延誤 5 天","依據 A：訂單交期變更","依據 B：P-04 延誤處理條款","資料不足時，應清楚說明未知事項"],"wiki":["generation","example"],"sources":["S02","S04"]},{"id":"risk","kicker":"09 · RAG 的限制","title":"有查資料，不代表不會錯","lead":"錯誤可以發生在來源、檢索，也可以發生在生成。","type":"three","points":["Source：文件過期、條件不完整","Retrieve：找不到真正關鍵段落","Generate：模型擅自補上未提供的數字"],"wiki":["limitations"],"sources":["S03","S04","S05"]},{"id":"metrics","kicker":"10 · 如何評估","title":"分成「找對」和「說對」","lead":"檢索品質與答案忠實度是兩種不同的檢查。","type":"metrics","points":["Hit@3：前三筆檢索是否找得到對的證據","Groundedness：回答是否被取回證據支持","人工審查：引用有沒有對到實際條款"],"wiki":["evaluation"],"sources":["S05","S02"]},{"id":"recap","kicker":"11 · 你會了嗎？","title":"把 RAG 記成一個循環","lead":"先查證，再回答；答完還要驗證。","type":"recap","points":["問題 → 檢索 → 補充上下文 → 生成","沒有證據就標記不知道","問題要回頭檢查資料與檢索，而非只重寫答案"],"wiki":["overview","evaluation","limitations"],"sources":["S02","S04","S05"]},{"id":"assignment","kicker":"附錄 A · 製作方法","title":"這份簡報如何從 LLM Wiki 產生？","lead":"六篇來源逐份整理 → Wiki 頁面 → 檢查 → HTML。","type":"workflow","points":["先討論受眾、題綱及要教的概念","逐份 ingest 6 篇來源的整理紀錄","更新具 crosslinks 與來源 lineage 的 Wiki","先 lint，再產生可瀏覽的 HTML 簡報"],"wiki":["workflow"],"sources":["S02","S05","S06"]},{"id":"reflection","kicker":"附錄 B · 修改 Graph","title":"最容易出錯的是「引用對應」","lead":"把來源檢查提前到 HTML 產生之前。","type":"reflection","points":["舊流程：生成 HTML → 才發現投影片漏引","新流程：檢查來源與 Wiki 對應 → 才生成 HTML","失敗就回到 Wiki／投影片草稿修正，再跑 lint"],"wiki":["workflow","evaluation"],"sources":["S02","S05"]},{"id":"sources","kicker":"附錄 C · 知識來源","title":"6 篇資料，逐頁可追溯","lead":"從投影片下方可返回 Wiki 及原始來源。","type":"sources","points":["S01 RAG 原始論文（Lewis et al.）","S02 Microsoft Foundry 文件","S03 Anthropic Contextual Retrieval","S04 IBM RAG 入門","S05 RAGAS 評估論文","S06 AWS 架構指南"],"wiki":["workflow","overview","evaluation"],"sources":["S01","S02","S03","S04","S05","S06"]}]};const pages=DATA.pages,sources=DATA.sources;const $=s=>document.querySelector(s);const clean=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected='overview';const byPage=id=>pages.find(p=>p.id===id);const bySource=id=>sources.find(s=>s.id===id);
function sidebar(q=''){const x=q.trim().toLowerCase();$('#navpages').innerHTML=pages.filter(p=>(p.title+' '+p.subtitle+' '+p.sections.flat().join(' ')).toLowerCase().includes(x)).map(p=>`<a class="wiki-link ${p.id===selected?'selected':''}" href="#${p.id}" data-page="${p.id}">${clean(p.title)}</a>`).join('')||'<p style="color:#adc1da">查無符合條目</p>'}
function page(id){const p=byPage(id)||pages[0];selected=p.id;history.replaceState(null,'','#'+selected);$('#view').innerHTML=`<div class="eyebrow">KNOWLEDGE NOTE / ${clean(selected.toUpperCase())}</div><h1>${clean(p.title)}</h1><p class="lead">${clean(p.subtitle)}</p>${p.sections.map(s=>`<section><h2>${clean(s[0])}</h2><p>${clean(s[1])}</p></section>`).join('')}${p.example?`<h2 class="section-title">生活例子</h2><div class="note">${clean(p.example)}</div>`:''}${p.note?`<p>${clean(p.note)}</p>`:''}<h2 class="section-title">來源追溯</h2><div class="source-items">${p.sources.map(id=>{let s=bySource(id);return `<div class="source-item"><strong>${id}</strong> · ${clean(s.title)}<div class="source-meta">${clean(s.publisher)} · ${s.year}</div><a href="${s.url}" target="_blank" rel="noopener noreferrer">查看原始來源 ↗</a></div>`}).join('')}</div><h2 class="section-title">相關概念</h2><div class="related">${p.related.map(id=>{let t=byPage(id);return `<a class="chip" href="#${id}" data-page="${id}">${clean(t.title)}</a>`}).join('')}</div><p class="hint">知識頁面與投影片由共同的資料檔產生；可在上方「教學簡報」查看教學版本。</p>`;sidebar($('#search').value)}
function listSources(){selected='';$('#view').innerHTML=`<div class="eyebrow">RAW SOURCE LAYER</div><h1>6 篇來源與 ingest 筆記</h1><p class="lead">以下保留六篇文獻的明確連結與其用途。raw/ 中存放根據這些資料整理的重點筆記，非原文全文。</p><div class="source-items">${sources.map(s=>`<div class="source-item"><strong>${s.id} · ${clean(s.title)}</strong><div class="source-meta">${clean(s.publisher)} / ${s.year}</div><p>${clean(s.topic)}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">原始文件 ↗</a></div>`).join('')}</div>`;sidebar($('#search').value)}
$('#search').addEventListener('input',e=>sidebar(e.target.value));document.addEventListener('click',e=>{const a=e.target.closest('[data-page]');if(a){e.preventDefault();page(a.dataset.page)}});$('#show-sources').onclick=listSources;window.addEventListener('hashchange',()=>page(location.hash.slice(1)));page(location.hash.slice(1)||'overview');</script></body></html>
